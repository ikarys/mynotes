<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ '/assets/screenshots/note-light.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#b4530c">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}" type="image/png">
  <link rel="preload" href="{{ '/assets/fonts/HankenGrotesk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
  </svg>

{{ content }}

  <footer class="site-footer wrap">
    <p>mynotes is written with AI assistance. Every number on this page was measured on a release build; how each claim is checked is in <a href="https://github.com/ikarys/mynotes/blob/main/VERIFICATION.md">VERIFICATION.md</a>.</p>
    <p>MIT licence. Source on <a href="{{ site.repo }}">GitHub</a>, <a href="https://github.com/ikarys/mynotes/blob/main/SECURITY.md">security policy</a>.</p>
  </footer>
</body>
</html>

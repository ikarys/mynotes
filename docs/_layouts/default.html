<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ '/assets/screenshots/note-light.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6efe3">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}" type="image/png">
  <link rel="preload" href="{{ '/assets/fonts/Fredoka.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="28" height="28">
      <span>mynotes</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="https://github.com/ikarys/mynotes/releases/latest">Download</a>
      <a href="{{ site.repo }}">GitHub</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>mynotes is written with AI assistance. Every number on this page was measured on a release build; how each claim is checked is in <a href="https://github.com/ikarys/mynotes/blob/main/VERIFICATION.md">VERIFICATION.md</a>.</p>
    <p>MIT licence · <a href="{{ site.repo }}">github.com/ikarys/mynotes</a> · <a href="https://github.com/ikarys/mynotes/blob/main/SECURITY.md">Security</a></p>
  </footer>

  <script>
    (function () {
      var mock = document.querySelector('.mock');
      if (!mock || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var q = mock.querySelector('.mock-q');
      var items = [].map.call(mock.querySelectorAll('li'), function (li) {
        var date = li.querySelector('small');
        return { li: li, title: li.textContent.slice(0, -date.textContent.length), date: date.outerHTML };
      });
      var word = q.textContent, timer;

      // Titles are fixed strings written in this page, so building the highlight markup from them is safe.
      function show(typed) {
        q.textContent = typed;
        var first = true;
        items.forEach(function (it) {
          var i = it.title.toLowerCase().indexOf(typed);
          it.li.hidden = i < 0;
          it.li.classList.toggle('top', i >= 0 && first);
          if (i < 0) return;
          first = false;
          it.li.innerHTML = '<span>' + it.title.slice(0, i) + (typed ? '<mark>' + it.title.substr(i, typed.length) + '</mark>' : '') + it.title.slice(i + typed.length) + '</span>' + it.date;
        });
      }

      // The final state is in the HTML for no-JS readers; here it is typed one letter at a time, like the real switcher filters.
      function play() {
        clearTimeout(timer);
        var n = 0;
        show('');
        (function step() {
          timer = setTimeout(function () { show(word.slice(0, ++n)); if (n < word.length) step(); }, n ? 260 : 700);
        })();
      }

      var replay = mock.querySelector('.replay');
      replay.hidden = false;
      replay.addEventListener('click', play);
      play();
    })();
  </script>
</body>
</html>

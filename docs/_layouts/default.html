<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ '/assets/screenshots/note-dark.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}" type="image/png">
  <link rel="preload" href="{{ '/assets/fonts/Oxanium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="28" height="28">
      <span>mynotes</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="https://github.com/ikarys/mynotes/releases/latest">Download</a>
      <a href="{{ site.repo }}">GitHub</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>mynotes is written with AI assistance. Every number on this page was measured on a release build; how each claim is checked is in <a href="https://github.com/ikarys/mynotes/blob/main/VERIFICATION.md">VERIFICATION.md</a>.</p>
    <p>MIT licence · <a href="{{ site.repo }}">github.com/ikarys/mynotes</a> · <a href="https://github.com/ikarys/mynotes/blob/main/SECURITY.md">Security</a></p>
  </footer>

  <script>
    (function () {
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var bank = document.querySelector('.bank');
      var fill = bank.querySelector('.bar-fill');
      var counters = [].slice.call(document.querySelectorAll('[data-target]'));

      // The HTML already shows the final digits (no-JS); here each tube gets all ten digits to light one at a time.
      counters.forEach(function (c) {
        c.tubes = [].map.call(c.querySelectorAll('.tube'), function (t) {
          var h = '';
          for (var d = 0; d < 10; d++) h += '<span class="d">' + d + '</span>';
          t.innerHTML = h;
          return t.querySelectorAll('.d');
        });
      });

      function render(group, f) {
        group.forEach(function (c) {
          var s = String(Math.round(+c.dataset.target * f));
          while (s.length < c.tubes.length) s = '0' + s;
          c.tubes.forEach(function (ds, i) {
            [].forEach.call(ds, function (d, k) { d.classList.toggle('on', k === +s[i]); });
          });
        });
        if (group === main) fill.style.transform = 'scaleX(' + f + ')';
      }

      function run(group) {
        cancelAnimationFrame(group.raf);
        if (reduced) return render(group, 1);
        var t0 = performance.now();
        (function frame(t) {
          var e = Math.min(324, t - t0);
          render(group, e / 324);
          if (e < 324) group.raf = requestAnimationFrame(frame);
        })(t0);
      }

      // The big bank and the stat tubes sit far apart, so each group counts when it scrolls into view.
      var main = counters.filter(function (c) { return bank.contains(c); });
      var stats = counters.filter(function (c) { return !bank.contains(c); });
      bank.querySelector('.replay').addEventListener('click', function () { run(main); });

      [[main, bank], [stats, stats[0] && stats[0].closest('dl')]].forEach(function (g) {
        if (!g[1]) return;
        if (reduced) return render(g[0], 1);
        render(g[0], 0);
        if (!('IntersectionObserver' in window)) return run(g[0]);
        var io = new IntersectionObserver(function (es) {
          if (es[0].isIntersecting) { io.disconnect(); run(g[0]); }
        }, { threshold: 0.6 });
        io.observe(g[1]);
      });
    })();
  </script>
</body>
</html>

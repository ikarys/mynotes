# Builds the Windows and Linux files from the tagged source and
# attaches them to a GitHub release, so anyone can trace a published binary back to its commit.
name: release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the files as an artifact to test before tagging, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions pinned by commit SHA: a moved tag cannot swap the code that runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Signs the installer for the in-app updater. The public half of the key is
      # in tauri.conf.json, so an update signed by any other key is refused.
      - run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Collect files
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          v="${TAG:-dev-${GITHUB_SHA::7}}"
          mkdir -p out/sig
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/mynotes-$v-windows-x64-setup.exe"
          cp src-tauri/target/release/mynotes.exe "out/mynotes-$v-windows-x64-portable.exe"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/sig/windows.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mynotes-windows
          path: out/

  linux:
    # The oldest supported runner keeps the glibc requirement low so the binaries run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      # Actions pinned by commit SHA: a moved tag cannot swap the code that runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - run: npm ci
      - run: npx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Signs the AppImage, the Linux file the in-app updater can replace.
      - run: npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":true}}'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Collect files
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          v="${TAG:-dev-${GITHUB_SHA::7}}"
          mkdir -p out/sig
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/mynotes-$v-linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/mynotes-$v-linux-amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig out/sig/linux.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mynotes-linux
          path: out/

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Actions pinned by commit SHA: a moved tag cannot swap the code that runs here.
      # The checkout is needed for --verify-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          merge-multiple: true
      - name: Collect files
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$TAG"
          mkdir out
          find dl -maxdepth 1 -type f -exec cp -t out {} +
          (cd out && sha256sum * > SHA256SUMS)
          # latest.json is what installed apps read to find and verify the update.
          export VERSION="${v#v}" SIG_WINDOWS="$(cat dl/sig/windows.sig)" SIG_LINUX="$(cat dl/sig/linux.sig)"
          export URL_WINDOWS="https://github.com/ikarys/mynotes/releases/download/$v/mynotes-$v-windows-x64-setup.exe"
          export URL_LINUX="https://github.com/ikarys/mynotes/releases/download/$v/mynotes-$v-linux-x86_64.AppImage"
          node -e 'const e = process.env; console.log(JSON.stringify({ version: e.VERSION, pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": { signature: e.SIG_WINDOWS, url: e.URL_WINDOWS },
              "linux-x86_64": { signature: e.SIG_LINUX, url: e.URL_LINUX }
            } }))' > out/latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$TAG" out/* --notes-from-tag --verify-tag
# Builds the Windows exe from the tagged source and attaches it to a GitHub
# release, so anyone can trace a published binary back to its commit.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Actions pinned by commit SHA: a moved tag cannot swap the code that runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          exe="mynotes-$TAG-windows-x64.exe"
          cp src-tauri/target/release/mynotes.exe "$exe"
          sha256sum "$exe" > "$exe.sha256"
          gh release create "$TAG" "$exe" "$exe.sha256" --notes-from-tag --verify-tag
